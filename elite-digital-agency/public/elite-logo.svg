<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Metallic Gradients -->
    <linearGradient id="goldTopHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="20%" stop-color="#F7D978" />
      <stop offset="45%" stop-color="#DFAC37" />
      <stop offset="70%" stop-color="#FFEFA7" />
      <stop offset="85%" stop-color="#B87D1B" />
      <stop offset="100%" stop-color="#734907" />
    </linearGradient>

    <linearGradient id="goldBevelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEA" />
      <stop offset="25%" stop-color="#E5B942" />
      <stop offset="50%" stop-color="#9C6B14" />
      <stop offset="75%" stop-color="#FCE588" />
      <stop offset="100%" stop-color="#5E3802" />
    </linearGradient>

    <linearGradient id="goldDarkShadow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A1F01" />
      <stop offset="40%" stop-color="#8C5C10" />
      <stop offset="70%" stop-color="#D9A832" />
      <stop offset="100%" stop-color="#FFEAA7" />
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="40%" stop-color="#22D3EE" />
      <stop offset="80%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Shield Background Radial Texture -->
    <radialGradient id="shieldInterior" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0C1424" />
      <stop offset="50%" stop-color="#060A14" />
      <stop offset="85%" stop-color="#020408" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="neonCircuitGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="goldDropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <filter id="text3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.95" />
    </filter>
  </defs>

  <!-- Deep Black Backing with Vignette -->
  <rect width="1000" height="1000" fill="#030509" />

  <!-- 1. LEFT & RIGHT GOLD LAUREL WREATHS -->
  <g filter="url(#goldDropShadow)">
    <!-- Left Laurels -->
    <g fill="url(#goldTopHighlight)" stroke="#4A2E05" stroke-width="2">
      <path d="M 230 320 C 170 380 130 480 130 600 C 130 720 180 820 250 890" fill="none" stroke="url(#goldTopHighlight)" stroke-width="8" stroke-linecap="round" />
      <path d="M 220 300 Q 180 280 160 310 Q 190 340 220 300 Z" />
      <path d="M 190 360 Q 140 350 124 384 Q 160 410 190 360 Z" />
      <path d="M 160 430 Q 110 430 100 470 Q 140 484 160 430 Z" />
      <path d="M 140 510 Q 84 520 80 560 Q 120 570 140 510 Z" />
      <path d="M 130 600 Q 76 620 80 660 Q 120 660 130 600 Z" />
      <path d="M 136 690 Q 90 720 104 760 Q 140 750 136 690 Z" />
      <path d="M 160 780 Q 130 820 156 856 Q 184 830 160 780 Z" />
      <path d="M 204 856 Q 184 900 220 924 Q 240 890 204 856 Z" />
    </g>

    <!-- Right Laurels -->
    <g fill="url(#goldTopHighlight)" stroke="#4A2E05" stroke-width="2">
      <path d="M 770 320 C 830 380 870 480 870 600 C 870 720 820 820 750 890" fill="none" stroke="url(#goldTopHighlight)" stroke-width="8" stroke-linecap="round" />
      <path d="M 780 300 Q 820 280 840 310 Q 810 340 780 300 Z" />
      <path d="M 810 360 Q 860 350 876 384 Q 840 410 810 360 Z" />
      <path d="M 840 430 Q 890 430 900 470 Q 860 484 840 430 Z" />
      <path d="M 860 510 Q 916 520 920 560 Q 880 570 860 510 Z" />
      <path d="M 870 600 Q 924 620 920 660 Q 880 660 870 600 Z" />
      <path d="M 864 690 Q 910 720 896 760 Q 860 750 864 690 Z" />
      <path d="M 840 780 Q 870 820 844 856 Q 816 830 840 780 Z" />
      <path d="M 796 856 Q 816 900 780 924 Q 760 890 796 856 Z" />
    </g>
  </g>

  <!-- 2. SHIELD 3D METALLIC BODY & BEVEL -->
  <g filter="url(#goldDropShadow)">
    <!-- Outer Gold Frame -->
    <path
      d="M 500 50 L 790 130 C 790 360 810 590 500 840 C 190 590 210 360 210 130 Z"
      fill="url(#goldBevelLight)"
      stroke="#3A1F01"
      stroke-width="6"
    />
    <!-- Middle Dark Accent Groove -->
    <path
      d="M 500 75 L 766 150 C 766 350 780 560 500 796 C 220 560 234 350 234 150 Z"
      fill="#0B0E17"
      stroke="url(#goldDarkShadow)"
      stroke-width="4"
    />
    <!-- Inner Gold Ridge -->
    <path
      d="M 500 90 L 750 162 C 750 340 760 540 500 770 C 240 540 250 340 250 162 Z"
      fill="url(#shieldInterior)"
      stroke="url(#goldTopHighlight)"
      stroke-width="7"
    />
  </g>

  <!-- 3. TOP ROYAL CROWN -->
  <g transform="translate(444, 85)" filter="url(#goldDropShadow)">
    <path
      d="M 4 56 L 20 20 L 56 44 L 92 20 L 108 56 Z"
      fill="url(#goldTopHighlight)"
      stroke="#5A3503"
      stroke-width="3"
    />
    <!-- Jewels -->
    <circle cx="20" cy="16" r="7" fill="#FFFBEA" stroke="#784405" stroke-width="2" />
    <circle cx="56" cy="8" r="9" fill="#FFFBEA" stroke="#784405" stroke-width="2" />
    <circle cx="92" cy="16" r="7" fill="#FFFBEA" stroke="#784405" stroke-width="2" />
    <rect x="4" y="54" width="104" height="10" rx="5" fill="url(#goldBevelLight)" stroke="#5A3503" stroke-width="2" />
  </g>

  <!-- 4. GLOWING CYAN CIRCUITRY TRACKS -->
  <g stroke="url(#cyanNeon)" stroke-width="4.5" stroke-linecap="round" filter="url(#neonCircuitGlow)">
    <!-- Circuit Bursts Radiating from Center EDA -->
    <!-- Top Left to WEBSITES -->
    <path d="M 440 360 L 390 280 L 360 280" />
    <circle cx="360" cy="280" r="5" fill="#22D3EE" />

    <!-- Top Center -->
    <path d="M 500 310 L 500 340" />
    <path d="M 470 320 L 490 344" />
    <path d="M 530 320 L 510 344" />
    <circle cx="500" cy="310" r="4" fill="#22D3EE" />

    <!-- Top Right to MEDIA -->
    <path d="M 560 360 L 610 280 L 640 280" />
    <circle cx="640" cy="280" r="5" fill="#22D3EE" />

    <!-- Mid Left to META ADS -->
    <path d="M 390 420 L 350 420 L 330 400" />
    <path d="M 390 460 L 330 460" />
    <circle cx="330" cy="400" r="5" fill="#22D3EE" />
    <circle cx="330" cy="460" r="5" fill="#22D3EE" />

    <!-- Mid Right to SEO -->
    <path d="M 610 420 L 650 420 L 670 400" />
    <path d="M 610 460 L 670 460" />
    <circle cx="670" cy="400" r="5" fill="#22D3EE" />
    <circle cx="670" cy="460" r="5" fill="#22D3EE" />

    <!-- Bottom Left to AUTOMATION -->
    <path d="M 430 540 L 380 590 L 360 590" />
    <circle cx="360" cy="590" r="5" fill="#22D3EE" />

    <!-- Bottom Right to AI BOTS -->
    <path d="M 570 540 L 620 590 L 640 590" />
    <circle cx="640" cy="590" r="5" fill="#22D3EE" />
  </g>

  <!-- 5. SIX DETAILED SERVICE EMBLEMS -->

  <!-- 1. WEBSITES (Top Left) -->
  <g transform="translate(260, 190)" filter="url(#goldDropShadow)">
    <rect x="0" y="0" width="120" height="84" rx="12" fill="#040814" stroke="url(#goldTopHighlight)" stroke-width="4" />
    <rect x="10" y="10" width="100" height="52" rx="6" fill="#0284C7" fill-opacity="0.3" stroke="#22D3EE" stroke-width="2" />
    <!-- Screen Grid & Globe -->
    <circle cx="60" cy="36" r="16" stroke="url(#goldTopHighlight)" stroke-width="2.5" fill="none" />
    <line x1="44" y1="36" x2="76" y2="36" stroke="url(#goldTopHighlight)" stroke-width="2" />
    <line x1="60" y1="20" x2="60" y2="52" stroke="url(#goldTopHighlight)" stroke-width="2" />
    <ellipse cx="60" cy="36" rx="8" ry="16" stroke="url(#goldTopHighlight)" stroke-width="2" fill="none" />
    <!-- Monitor Stand -->
    <path d="M 52 62 L 68 62 L 74 76 L 46 76 Z" fill="url(#goldTopHighlight)" stroke="#4A2E05" stroke-width="1.5" />
    <text x="60" y="98" text-anchor="middle" fill="url(#goldTopHighlight)" font-size="13" font-weight="bold" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="1">
      WEBSITES
    </text>
  </g>

  <!-- 2. MEDIA (Top Right) -->
  <g transform="translate(610, 190)" filter="url(#goldDropShadow)">
    <circle cx="70" cy="44" r="44" fill="#040814" stroke="url(#goldTopHighlight)" stroke-width="5" />
    <circle cx="70" cy="44" r="32" fill="#0284C7" fill-opacity="0.4" stroke="#22D3EE" stroke-width="3" />
    <circle cx="70" cy="44" r="18" fill="#1E293B" stroke="url(#goldTopHighlight)" stroke-width="2" />
    <circle cx="64" cy="38" r="6" fill="#38BDF8" />
    <text x="70" y="104" text-anchor="middle" fill="url(#goldTopHighlight)" font-size="13" font-weight="bold" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="1">
      MEDIA
    </text>
  </g>

  <!-- 3. META ADS (Mid Left) -->
  <g transform="translate(225, 350)" filter="url(#goldDropShadow)">
    <circle cx="56" cy="50" r="40" fill="#040814" stroke="url(#goldTopHighlight)" stroke-width="4" />
    <circle cx="56" cy="50" r="28" fill="none" stroke="url(#goldTopHighlight)" stroke-width="3" />
    <circle cx="56" cy="50" r="16" fill="none" stroke="#22D3EE" stroke-width="3" />
    <circle cx="56" cy="50" r="6" fill="url(#goldTopHighlight)" />
    <!-- Dart Arrow -->
    <line x1="76" y1="30" x2="56" y2="50" stroke="url(#goldTopHighlight)" stroke-width="4" stroke-linecap="round" />
    <path d="M 76 30 L 84 24 L 88 36 Z" fill="url(#goldTopHighlight)" stroke="#4A2E05" stroke-width="1.5" />
    <text x="56" y="108" text-anchor="middle" fill="url(#goldTopHighlight)" font-size="13" font-weight="bold" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="1">
      META ADS
    </text>
  </g>

  <!-- 4. SEO (Mid Right) -->
  <g transform="translate(650, 350)" filter="url(#goldDropShadow)">
    <circle cx="64" cy="50" r="40" fill="#040814" stroke="url(#goldTopHighlight)" stroke-width="4" />
    <!-- Chart Bars -->
    <rect x="40" y="54" width="10" height="20" fill="url(#goldTopHighlight)" rx="2" />
    <rect x="54" y="42" width="10" height="32" fill="url(#goldTopHighlight)" rx="2" />
    <rect x="68" y="30" width="10" height="44" fill="url(#goldTopHighlight)" rx="2" />
    <!-- Trend Arrow -->
    <path d="M 36 50 L 78 24 M 78 24 L 68 24 M 78 24 L 78 34" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="108" text-anchor="middle" fill="url(#goldTopHighlight)" font-size="13" font-weight="bold" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="1">
      SEO
    </text>
  </g>

  <!-- 5. AUTOMATION (Bottom Left) -->
  <g transform="translate(265, 520)" filter="url(#goldDropShadow)">
    <!-- Big Gear -->
    <circle cx="50" cy="40" r="28" fill="#040814" stroke="url(#goldTopHighlight)" stroke-width="4" />
    <circle cx="50" cy="40" r="12" fill="#040814" stroke="url(#goldTopHighlight)" stroke-width="3" />
    <circle cx="50" cy="8" r="4" fill="url(#goldTopHighlight)" />
    <circle cx="50" cy="72" r="4" fill="url(#goldTopHighlight)" />
    <circle cx="18" cy="40" r="4" fill="url(#goldTopHighlight)" />
    <circle cx="82" cy="40" r="4" fill="url(#goldTopHighlight)" />
    <!-- Interlocking Small Gear -->
    <circle cx="76" cy="60" r="18" fill="#040814" stroke="url(#goldTopHighlight)" stroke-width="3" />
    <circle cx="76" cy="60" r="7" fill="none" stroke="#22D3EE" stroke-width="2" />
    <text x="60" y="104" text-anchor="middle" fill="url(#goldTopHighlight)" font-size="13" font-weight="bold" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="1">
      AUTOMATION
    </text>
  </g>

  <!-- 6. AI BOTS (Bottom Right) -->
  <g transform="translate(610, 520)" filter="url(#goldDropShadow)">
    <circle cx="60" cy="44" r="38" fill="#040814" stroke="url(#goldTopHighlight)" stroke-width="4" />
    <!-- Robot Face -->
    <rect x="36" y="28" width="48" height="36" rx="12" fill="#0E1E38" stroke="url(#goldTopHighlight)" stroke-width="3" />
    <!-- Glowing Cyan Eyes -->
    <ellipse cx="48" cy="44" rx="6" ry="4" fill="#22D3EE" filter="url(#neonCircuitGlow)" />
    <ellipse cx="72" cy="44" rx="6" ry="4" fill="#22D3EE" filter="url(#neonCircuitGlow)" />
    <!-- Ears -->
    <circle cx="32" cy="46" r="4" fill="url(#goldTopHighlight)" />
    <circle cx="88" cy="46" r="4" fill="url(#goldTopHighlight)" />
    <!-- Antenna -->
    <line x1="60" y1="28" x2="60" y2="20" stroke="url(#goldTopHighlight)" stroke-width="3" />
    <circle cx="60" cy="18" r="4" fill="#22D3EE" />
    <text x="60" y="104" text-anchor="middle" fill="url(#goldTopHighlight)" font-size="13" font-weight="bold" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="1">
      AI BOTS
    </text>
  </g>

  <!-- 6. CENTER 3D HEXAGON CORE & "EDA" MONOGRAM -->
  <g transform="translate(500, 450)" filter="url(#goldDropShadow)">
    <!-- Hexagon 3D Extrusion Backing -->
    <polygon
      points="0,-96 84,-48 84,48 0,96 -84,48 -84,-48"
      fill="url(#goldBevelLight)"
      stroke="#3A1F01"
      stroke-width="6"
    />
    <!-- Hexagon Inner Facet -->
    <polygon
      points="0,-84 72,-42 72,42 0,84 -72,42 -72,-42"
      fill="#050C1C"
      stroke="url(#goldTopHighlight)"
      stroke-width="4"
    />

    <!-- Bold 3D Golden "EDA" Extruded Letters -->
    <g filter="url(#text3DShadow)">
      <!-- Under-shadow text -->
      <text
        x="0"
        y="28"
        text-anchor="middle"
        fill="#3A1F01"
        font-size="68"
        font-weight="900"
        font-family="'Cinzel', 'Trajan Pro', 'Times New Roman', Georgia, serif"
        letter-spacing="4"
      >
        EDA
      </text>
      <!-- Main Metallic Gold Text -->
      <text
        x="0"
        y="24"
        text-anchor="middle"
        fill="url(#goldTopHighlight)"
        stroke="#5A3503"
        stroke-width="3"
        font-size="68"
        font-weight="900"
        font-family="'Cinzel', 'Trajan Pro', 'Times New Roman', Georgia, serif"
        letter-spacing="4"
      >
        EDA
      </text>
    </g>
  </g>

  <!-- 7. LOWER BEVELED PLAQUE: "ELITE" & "DIGITAL AGENCY" -->
  <g transform="translate(120, 630)" filter="url(#goldDropShadow)">
    <!-- Heavy Gold Plaque Base -->
    <path
      d="M 40 0 L 720 0 L 750 50 L 720 170 L 40 170 L 10 50 Z"
      fill="#030814"
      stroke="url(#goldBevelLight)"
      stroke-width="8"
    />
    <!-- Inner Rim Inset -->
    <rect x="50" y="16" width="660" height="140" rx="6" fill="none" stroke="url(#goldTopHighlight)" stroke-width="2.5" />

    <!-- Big Serif "ELITE" -->
    <g filter="url(#text3DShadow)">
      <text
        x="380"
        y="96"
        text-anchor="middle"
        fill="url(#goldTopHighlight)"
        stroke="#4A2902"
        stroke-width="3"
        font-size="88"
        font-weight="900"
        font-family="'Cinzel', 'Cinzel Decorative', 'Times New Roman', serif"
        letter-spacing="12"
      >
        ELITE
      </text>
    </g>

    <!-- Side Dots & "DIGITAL AGENCY" -->
    <circle cx="170" cy="136" r="6" fill="url(#goldTopHighlight)" stroke="#4A2902" stroke-width="1.5" />
    <text
      x="380"
      y="144"
      text-anchor="middle"
      fill="url(#goldTopHighlight)"
      font-size="28"
      font-weight="bold"
      font-family="'Cinzel', 'Trajan Pro', sans-serif"
      letter-spacing="10"
    >
      DIGITAL AGENCY
    </text>
    <circle cx="590" cy="136" r="6" fill="url(#goldTopHighlight)" stroke="#4A2902" stroke-width="1.5" />
  </g>

  <!-- 8. BOTTOM GOLD RIBBON: "AI POWERED. RESULTS DRIVEN." -->
  <g transform="translate(260, 840)" filter="url(#goldDropShadow)">
    <!-- Ribbon Banner Body with Swallowtail Cutouts -->
    <path
      d="M 20 0 L 460 0 L 490 30 L 460 50 L 20 50 L -10 30 Z"
      fill="url(#goldDarkShadow)"
      stroke="url(#goldTopHighlight)"
      stroke-width="4"
    />
    <text
      x="240"
      y="32"
      text-anchor="middle"
      fill="#FFFBEA"
      font-size="17"
      font-weight="900"
      font-family="'Segoe UI', Arial, sans-serif"
      letter-spacing="3.6"
    >
      AI POWERED. RESULTS DRIVEN.
    </text>
  </g>

  <!-- 9. BOTTOM FACETED GOLD DIAMOND JEWEL -->
  <g transform="translate(500, 930)" filter="url(#goldDropShadow)">
    <polygon points="0,-24 28,0 0,28 -28,0" fill="url(#goldBevelLight)" stroke="#5B3602" stroke-width="3" />
    <polygon points="0,-16 18,0 0,18 -18,0" fill="#FFEAA7" />
  </g>
</svg>
